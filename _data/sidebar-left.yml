# ============================================================
# LEFT SIDEBAR
#
# Each "- title:" below starts a new panel. Panels appear on
# the page in the same order they appear here. To add one,
# copy an existing block and change the values. To remove one,
# delete its block (or put a # in front of every line).
#
# Indentation is meaningful: two spaces, never tabs. Keep the
# "-" lined up with the other "-" signs.
#
# ------------------------------------------------------------
# KEYS YOU CAN USE (only `title` is required)
#
#   title:      text on the panel's button
#   link:       makes the title button clickable, e.g. /works/
#
#   image:      a png / jpg / gif, e.g. /assets/images/panels/x.gif
#   alt:        description of the image for screen readers
#   caption:    small grey text underneath the image
#   image_link: makes the image clickable
#   pixelated:  true  -> crisp upscaling, good for pixel art and
#                        small simulation gifs (default is smooth)
#
#   text:       a paragraph of copy
#
#   links:      a list of links, each with a name and a url
#
#   embed:      a URL to put in an iframe (video, widget)
#   ratio:      aspect ratio for the embed, e.g. "16 / 9"
#
#   html:       raw HTML, for anything the keys above miss
#
# You can combine them. If a panel has both an image and text,
# the image renders first, then the text, then any links.
# ============================================================

