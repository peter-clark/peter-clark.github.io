# ============================================================
# LEFT SIDEBAR
#
# Each "- title:" below starts a new panel. Panels appear on
# the page in the same order they appear here. To add one,
# copy an existing block and change the values. To remove one,
# delete its block (or put a # in front of every line).
#
# Indentation is meaningful: two spaces, never tabs. Keep the
# "-" lined up with the other "-" signs.
#
# ------------------------------------------------------------
# KEYS YOU CAN USE (only `title` is required)
#
#   title:      text on the panel's button
#   link:       makes the title button clickable, e.g. /works/
#
#   image:      a png / jpg / gif, e.g. /assets/images/panels/x.gif
#               Shown as a tile clipped to the same rounded
#               rectangle as the panel's inner well.
#   alt:        description of the image for screen readers
#   caption:    small grey text underneath the tile
#   image_link: makes the tile link somewhere other than `link`
#   pixelated:  true  -> crisp upscaling, good for pixel art and
#                        small simulation gifs (default is smooth)
#   reveal:     true  -> the tile shows this panel's `text` in
#                        orange inside an orange rule, and swaps
#                        to the gif on hover. The tile keeps its
#                        size either way, so the panel never jumps.
#   ratio:      shape of the tile, e.g. "4 / 3". Default is square.
#
#   text:       a paragraph of copy. Shown under the panel normally,
#               or inside the tile when `reveal: true`.
#
#   links:      a list of links, each with a name, a url, and an
#               optional meta line of small grey text
#
#   posts:      a number -> list that many recent entries from _posts
#
#   embed:      a URL to put in an iframe (video, widget)
#
#   html:       raw HTML, for anything the keys above miss
#
# You can combine them. Blocks render in this order: image,
# text, posts, links, embed, html.
# ============================================================

- title: Research & Other Work
