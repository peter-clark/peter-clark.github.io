# Site Specific Configuration
name: neocorax
description: If it can be known, it'd be intolerable not to.
url: https://neocorax.com
author: neocorax
timezone: Europe/Madrid
timezone_short: CET

# Keywords
keywords: ['complex systems', 'statistical physics', 'simulations']

# Animated page-background effect.
# Loads /assets/js/<name>.js, which renders into the #bg-fx layer.
# Change to another file's name to swap effects, or set to false to disable.
background_effect: dither

# Banner inset effect (behind the title/subtitle, inside the silver border).
# Loads /assets/js/<name>.js, which renders into the #banner-fx layer.
banner_effect: lines

# Analytics (Plausible requires sign-up)
analytics:
  plausible:
    enabled: false
    site_fqdn: 'your.site.fqdn'
    script_source: 'https://plausible.io/js/script.js'

# Styling
sass:
  sass_dir: _sass
  style: expanded # compact, expanded or compressed

# Paginate
pagination:
  enabled: true
  # Value set low for demonstration purposes
  per_page: 3
  sort_field: 'date'
  sort_reverse: true

# Category Paginating
autopages:
  enabled: true
  categories:
    title: 'Posts in category :cat'
    permalink: '/category/:cat'
    silent: false

# Exclusions
exclude: [ 'README.md', 'COPYING' ]

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag

