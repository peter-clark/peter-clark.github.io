---
layout: default
---

<p><a href="/simulations/">&laquo; All simulations</a></p>

{% if page.description %}
<p class="text-justify">{{ page.description }}</p>
{% endif %}

<div class="sim-stage">
    <div class="sim-canvas-wrap">
        <!-- The simulation renders here. Width/height are the pixel resolution;
             CSS scales the element to fit its column. -->
        <canvas id="sim-canvas" width="400" height="400"></canvas>
    </div>

    <div class="sim-controls" id="sim-controls">
        <button id="sim-toggle">Start / Pause</button>
        <button id="sim-step" class="secondary">Step</button>
        <button id="sim-reset" class="secondary">Reset</button>

        <!-- Per-simulation parameter controls are injected by each sim's JS.
             See the skeleton in assets/js/simulations/{{ page.sim_id }}.js -->
        <div id="sim-params"></div>
    </div>
</div>

<!-- Live figures. Their own full-width panel rather than the bottom of the
     control column: in there they made that column taller than the square
     canvas, which left a band of empty frame beside it. Filled by
     Sim.readout() so every simulation reports in the same layout. -->
<div class="sim-stats">
    <div class="sim-readout" id="sim-readout"></div>
</div>

<!-- Full-width area below the stage. Simulations that produce live plots
     inject their graphs here; .sim-graph carries the same frame. -->
<div id="sim-below" class="sim-below"></div>

{{ content }}

{% if page.plotly %}
<!-- MathJax v3 lets Plotly render $...$ LaTeX in axis labels, and (unlike v2)
     keeps re-rendering them as the plots update. Must load before Plotly. -->
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$']] }, svg: { fontCache: 'local' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<!-- Plotly is only pulled in on pages that set `plotly: true` in front matter. -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
{% endif %}

<!-- Shared helpers (grid, render loop) then the specific simulation. -->
<script src="{{ site.baseurl }}/assets/js/simulations/engine.js?v={{ site.time | date: '%s' }}"></script>
<script src="{{ site.baseurl }}/assets/js/simulations/{{ page.sim_id }}.js?v={{ site.time | date: '%s' }}"></script>
